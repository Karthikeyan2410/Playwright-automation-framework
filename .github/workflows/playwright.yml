- name: Upload Intentional Failure Report (Debug Demo)
  uses: actions/upload-artifact@v4
  if: always()
  with:
    name: playwright-report-failure-demo
    path: path/to/failed-report/  # Replace with actual directory path
    retention-days: 30

- name: Upload Passing Test Suite Report
  uses: actions/upload-artifact@v4
  if: always()
  with:
    name: playwright-report-passing-suite
    path: path/to/passed-report/  # Replace with actual directory path
    retention-days: 30